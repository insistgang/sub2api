# Load inside http {}, alongside the existing access_log directive.
# Metadata only: no request body, query string, authorization header or client IP.
map "$server_name:$uri" $sub2api_images_diagnostic {
    default 0;
    ~^(us|api)\.insistgang\.top:/(v1/)?images/(generations|edits)$ 1;
}

log_format sub2api_image_transport escape=json
    '{"time":"$time_iso8601",'
    '"nginx_request_id":"$request_id",'
    '"server_name":"$server_name",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"status":$status,'
    '"received_request_bytes":$request_length,'
    '"declared_body_bytes":"$http_content_length",'
    '"response_body_bytes":$body_bytes_sent,'
    '"request_seconds":$request_time,'
    '"upstream_status":"$upstream_status",'
    '"upstream_seconds":"$upstream_response_time",'
    '"upstream_bytes":"$upstream_response_length"}';

access_log /var/log/nginx/sub2api-images.log sub2api_image_transport if=$sub2api_images_diagnostic;
